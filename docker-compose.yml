# Producció (VPS): el proxy nginx extern (xarxa "proxy") fa de frontal HTTPS.
# Per a desenvolupament local, vegeu docker-compose.dev.yml.
#
# Nom de projecte propi: la instal·lació antiga era el projecte "inventory" i
# compose recrearia (esborrant-lo) el seu contenidor si compartissin nom.
name: inventari

services:
  web:
    build: .
    image: inventari-web
    container_name: inventory
    hostname: inventory
    restart: unless-stopped
    env_file: .env
    volumes:
      - inventory_data:/app/data
      - inventory_media:/app/media
    networks:
      - inventory_network
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Còpia diària de la BD SQLite i de les fotos/QR (retenció: BACKUP_KEEP_DAYS)
  backup:
    image: inventari-web
    pull_policy: never
    container_name: inventory-backup
    restart: unless-stopped
    # Mateix uid que l'app: la BD és 600 i el servei no té cap capability
    user: "1000:1000"
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Europe/Madrid
    volumes:
      - inventory_data:/data:ro
      - inventory_media:/media:ro
      - ./backups/daily:/backups
    entrypoint: ["python", "/app/scripts/backup.py"]
    # La imatge porta el healthcheck de gunicorn, que aquí no aplica
    healthcheck:
      disable: true
    network_mode: none
    cap_drop:
      - ALL
    depends_on:
      - web

volumes:
  inventory_data:
    name: inventory_data
  inventory_media:
    name: inventory_media

networks:
  inventory_network:
  proxy:
    external: true
