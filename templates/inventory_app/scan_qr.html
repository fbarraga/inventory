{% extends 'base.html' %}
{% block content %}
<h1><i class="bi bi-qr-code-scan"></i> Escanejar Codi QR</h1>
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <div id="reader" style="width:100%;"></div>
                <hr>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">O introdueix el codi manualment:</label>
                        <input type="text" class="form-control" name="codigo" placeholder="Ej: INV-0001" id="codigo">
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Cercar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
function onScanSuccess(decodedText, decodedResult) {
    html5QrcodeScanner.clear();
    document.getElementById('codigo').value = decodedText;
    document.querySelector('form').submit();
}
var html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
html5QrcodeScanner.render(onScanSuccess);
</script>
{% endblock %}
