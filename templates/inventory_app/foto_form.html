{% extends 'base.html' %}
{% block content %}
<h1>Afegir Fotografia</h1>
<div class="card mt-3">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Afegir Foto</button>
            <a href="{% url 'inventario_detail' inventario.pk %}" class="btn btn-secondary">Cancel·lar</a>
        </form>
    </div>
</div>
{% endblock %}
