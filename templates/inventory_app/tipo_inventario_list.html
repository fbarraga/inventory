{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h1><i class="bi bi-tags"></i> Tipus de Inventari</h1>
    <a href="{% url 'tipo_inventario_create' %}" class="btn btn-primary"><i class="bi bi-plus"></i> Nou Tipus</a>
</div>
<div class="card mt-3">
    <div class="card-body">
        <table class="table">
            <thead>
                <tr><th>Nom</th><th>Total</th><th>Estat</th><th>Accions</th></tr>
            </thead>
            <tbody>
                {% for tipo in tipos %}
                <tr>
                    <td>{{ tipo.nombre }}</td>
                    <td><span class="badge bg-info">{{ tipo.total_inventarios }}</span></td>
                    <td>{% if tipo.activo %}<span class="badge bg-success">Actiu</span>{% else %}<span class="badge bg-secondary">Inactiu</span>{% endif %}</td>
                    <td><a href="{% url 'tipo_inventario_edit' tipo.pk %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
